<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Intelligence PoC</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e3e7ee;--accent:#0b5cad;
--band:#cfdaea;--dot:#8a99ad;--s1:#2e8b57;--s2:#8fb339;--s3:#e0a800;--s4:#e2711d;--s5:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#182029;--band:#34465a;--dot:#6f8199;--ink:#e8edf3;--mute:#9aa6b5;--line:#2a3541;--accent:#5aa2e8}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button.act{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.pill{display:inline-block;min-width:26px;text-align:center;border-radius:12px;padding:1px 8px;color:#fff;font-weight:600}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}.s0{background:var(--mute)}
.mute{color:var(--mute)}.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
a{color:var(--accent);cursor:pointer}pre{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
.c1{background:var(--s5)}.c2{background:var(--s4)}.c3{background:var(--s2)}.c4{background:var(--s1)}
.top{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.ctl{display:flex;gap:12px;align-items:flex-end}
.chip{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:2px 10px;margin:0 6px 6px 0;font-size:13px}
.chip a{margin-left:4px;font-weight:700}
.picker{max-height:260px;overflow:auto;margin-top:8px}.gh{font-size:12px;font-weight:700;color:var(--mute);margin-top:8px;text-transform:uppercase}
.pk{display:block;padding:2px 0;cursor:pointer}
.qchip{display:inline-block;border-radius:10px;padding:1px 9px;color:#fff;font-size:12px;font-weight:600}
.mrow{display:grid;grid-template-columns:minmax(200px,1.5fr) minmax(130px,.8fr) minmax(130px,.8fr) minmax(240px,1.4fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}.rb{width:100%;max-width:340px;height:auto}
svg text.ax{font-size:11px;fill:var(--mute)}svg text.lbl{font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px}svg.chart{width:100%;height:auto}
.callout{background:var(--bg);border-left:4px solid var(--accent);padding:8px 12px;border-radius:4px;margin-bottom:8px}
.rankbox{max-height:440px;overflow:auto;margin-top:8px;position:relative}.bar{height:8px;border-radius:4px}.rankbox th{position:sticky;top:0;background:var(--card)}
tr.me td{background:var(--bg);font-weight:600}
@media (max-width:760px){.mrow{grid-template-columns:1fr 1fr}.mc{grid-column:1/-1}.ctl{flex-wrap:wrap}}
.up{color:var(--s1)}.dn{color:var(--s5)}
</style>
</head>
<body>
<header><h1>Trust Intelligence PoC</h1>
<nav id="nav"></nav><span class="mute" style="margin-left:auto">Internal spike. Public NHS data joined by ODS code.</span></header>
<main id="main"></main>
<script>
var state = {tab: 'dashboard', trusts: [], sort: 'strain', dir: -1, filter: '', cmp: [], fields: null, scope: null, cat: null, gopts: null, typeFilter: '', eview: 'snapshot', emonths: 24, dtype: 'g:acute', dx: 'overall', dy: 'nof_score'};
var TABS = [['dashboard', 'Dashboard'], ['trust', 'Trust dashboard'], ['explorer', 'Explorer'], ['digital', 'Digital maturity'], ['compare', 'Compare'], ['sources', 'Sources']];

function api(path, opts) {
  return fetch(path, opts).then(function (r) {
    if (!r.ok) { return r.text().then(function (t) { throw new Error(r.status + ' ' + t); }); }
    return r.json();
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function num(v, d) { return v == null ? '–' : Number(v).toLocaleString('en-GB', {maximumFractionDigits: d == null ? 1 : d}); }
var CQC = {1: 'Inadequate', 2: 'Requires improvement', 3: 'Good', 4: 'Outstanding'};
function cqcPill(v) { return v ? '<span class="pill c' + v + '" style="min-width:0" title="CQC overall rating">' + CQC[v] + '</span>' : '<span class="mute">–</span>'; }
function pill(s) { return '<span class="pill s' + (s || 0) + '" title="Strain 1 (low) to 5 (high)">' + (s || '–') + '</span>'; }

function nav() {
  document.getElementById('nav').innerHTML = TABS.map(function (t) {
    return '<button class="' + (state.tab === t[0] ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>';
  }).join('');
}
function go(tab, arg) {
  state.tab = tab; nav();
  if (tab === 'dashboard') { return dashboard(); }
  if (tab === 'trust') { return trustView(arg || state.current); }
  if (tab === 'explorer') { return explorerView(arg); }
  if (tab === 'digital') { return digitalView(); }
  if (tab === 'compare') { return compareView(); }
  if (tab === 'sources') { return sourcesView(); }
}
function main(html) { document.getElementById('main').innerHTML = html; }

function dashboard() {
  Promise.all([api('/api/trusts'), getGroups()]).then(function (res) {
    state.trusts = res[0]; drawDashboard();
  }).catch(fail);
}
function drawDashboard() {
  var f = state.filter.toLowerCase();
  var rows = state.trusts.filter(function (t) {
    return matchesType(t, state.typeFilter) && (!f || (t.name || '').toLowerCase().indexOf(f) >= 0 || t.ods_code.toLowerCase().indexOf(f) >= 0 ||
      t.suppliers.join(' ').toLowerCase().indexOf(f) >= 0);
  });
  rows.sort(function (a, b) {
    var x = a[state.sort], y = b[state.sort];
    if (x == null && y == null) { return 0; } if (x == null) { return 1; } if (y == null) { return -1; }
    return (x > y ? 1 : x < y ? -1 : 0) * state.dir;
  });
  var scored = state.trusts.filter(function (t) { return t.strain && matchesType(t, state.typeFilter); });
  var dist = [1, 2, 3, 4, 5].map(function (s) { return scored.filter(function (t) { return t.strain === s; }).length; });
  var h = '<div class="card"><div class="grid">' + dist.map(function (n, i) {
    return '<div>' + pill(i + 1) + ' <b>' + n + '</b> <span class="mute">trusts at strain ' + (i + 1) + '</span></div>';
  }).join('') + '</div><p class="mute" style="margin:8px 0 0">Strain 1–5 is a v0 indicator derived from the NHS Oversight Framework segment. ' +
    state.trusts.length + ' organisations loaded' + (state.typeFilter ? '; strain counts are for the selected type.' : '.') + '</p></div>';
  h += '<div class="card"><input id="flt" placeholder="Filter by name, code or supplier" value="' + esc(state.filter) + '" oninput="state.filter=this.value;drawDashboard();document.getElementById(\'flt\').focus()"> ' +
    '<select id="tf" onchange="state.typeFilter=this.value;drawDashboard()" title="Filter by NHS Oversight Framework trust type or subtype">' + typeOptions(state.typeFilter) + '</select> <span class="mute">' + rows.length + ' shown</span>';
  h += '<div class="wrap"><table><tr>' +
    [['name', 'Trust'], ['ods_code', 'Code'], ['subtype', 'Type'], ['strain', 'Strain'], ['cqc_overall', 'CQC'], ['rtt_pct_18w', 'RTT within 18w %'], ['rtt_waiting', 'RTT waiting list'], ['suppliers', 'Suppliers']]
      .map(function (c) { return '<th class="' + (c[0].indexOf('rtt') === 0 ? 'n' : '') + '" onclick="sortBy(\'' + c[0] + '\')">' + c[1] + '</th>'; }).join('') + '<th></th></tr>';
  rows.slice(0, 400).forEach(function (t) {
    h += '<tr><td><a onclick="go(\'trust\',\'' + t.ods_code + '\')">' + esc(t.name || t.ods_code) + '</a></td><td>' + esc(t.ods_code) + '</td><td class="mute">' + esc(subLabel(t.subtype) || groupLabel(t.peer_group)) + '</td><td>' + pill(t.strain) + '</td><td>' + cqcPill(t.cqc_overall) + '</td>' +
      '<td class="n">' + num(t.rtt_pct_18w) + '</td><td class="n">' + num(t.rtt_waiting, 0) + '</td><td>' +
      t.suppliers.map(function (s) { return '<span class="tag">' + esc(s) + '</span>'; }).join('') + '</td>' +
      '<td><input type="checkbox" ' + (state.cmp.indexOf(t.ods_code) >= 0 ? 'checked' : '') + ' onchange="toggleCmp(\'' + t.ods_code + '\',this.checked)" title="Add to compare"></td></tr>';
  });
  h += '</table></div></div>';
  if (!state.trusts.length) { h = '<div class="card">No data yet. Open <a onclick="go(\'sources\')">Sources</a> and run a refresh.</div>'; }
  main(h);
}
function sortBy(k) { state.dir = state.sort === k ? -state.dir : 1; state.sort = k; drawDashboard(); }
function toggleCmp(c, on) {
  state.cmp = state.cmp.filter(function (x) { return x !== c; });
  if (on) { state.cmp.push(c); }
  state.cmp = state.cmp.slice(-5);
}

/* ---------- benchmarking: shared helpers ---------- */
var QCOL = {1: 'var(--s1)', 2: 'var(--s2)', 3: 'var(--s4)', 4: 'var(--s5)'};
var QTXT = {1: 'Top quartile', 2: 'Upper middle', 3: 'Lower middle', 4: 'Bottom quartile'};
function enc(s) { return encodeURIComponent(s); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory only */ } }
function coreCodes(cat) {
  return cat.filter(function (c) { return c.core; }).sort(function (a, b) { return a.core_rank - b.core_rank; }).map(function (c) { return c.metric_code; });
}
function getCatalogue() {
  return state.cat ? Promise.resolve(state.cat) : api('/api/benchmark/metrics').then(function (c) { state.cat = c; return c; });
}
function getGroups() {
  return state.gopts ? Promise.resolve(state.gopts) : api('/api/benchmark/groups').then(function (g) { state.gopts = g; return g; });
}
/* Type filter values: '' (all), 'g:<trust type key>' or 's:<subtype key>'. */
function typeOptions(selected) {
  var g = state.gopts, h = '<option value="">All organisations</option><optgroup label="Trust type">';
  g.groups.forEach(function (x) { h += '<option value="g:' + x.key + '"' + (selected === 'g:' + x.key ? ' selected' : '') + '>' + esc(x.label) + ' (' + x.n + ')</option>'; });
  h += '</optgroup><optgroup label="Subtype">';
  g.subtypes.forEach(function (x) { h += '<option value="s:' + x.key + '"' + (selected === 's:' + x.key ? ' selected' : '') + '>' + esc(x.label) + ' (' + x.n + ')</option>'; });
  return h + '</optgroup>';
}
function subLabel(key) {
  var hit = state.gopts && state.gopts.subtypes.filter(function (x) { return x.key === key; })[0];
  return hit ? hit.label : '';
}
function groupLabel(key) {
  var hit = state.gopts && state.gopts.groups.filter(function (x) { return x.key === key; })[0];
  return hit ? hit.label : '';
}
function matchesType(t, f) {
  if (!f) { return true; }
  return f.indexOf('g:') === 0 ? t.peer_group === f.slice(2) : t.subtype === f.slice(2);
}
function getTrusts() {
  return state.trusts.length ? Promise.resolve(state.trusts) : api('/api/trusts').then(function (r) { state.trusts = r; return r; });
}
function fmt(v, unit) {
  if (v == null) { return '–'; }
  if (unit === 'rating') { return CQC[Math.round(v)] || num(v, 1); }
  if (unit === 'pct') { return num(v, 1) + '%'; }
  if (unit === 'segment') { return 'Segment ' + num(v, 0); }
  if (unit === 'flag') { return v ? 'Yes' : 'No'; }
  if (unit === 'rank') { return '#' + num(v, 0); }
  if (unit === 'mins') { return num(v, 1) + ' min'; }
  return num(v, Math.abs(v) >= 100 ? 0 : 2);
}
function dirText(pol) { return pol === 'higher' ? 'Higher is better' : pol === 'lower' ? 'Lower is better' : 'No direction implied: ranked highest first'; }
function rankOf(points, mine, pol) {
  var ahead = 0, behind = 0;
  points.forEach(function (p) {
    if (pol === 'lower') { if (p.value < mine) { ahead++; } else if (p.value > mine) { behind++; } }
    else { if (p.value > mine) { ahead++; } else if (p.value < mine) { behind++; } }
  });
  return {rank: ahead + 1, n: points.length, beaten: points.length > 1 ? Math.round(1000 * behind / (points.length - 1)) / 10 : 100};
}
function quartileOf(beaten) { return beaten >= 75 ? 1 : beaten >= 50 ? 2 : beaten >= 25 ? 3 : 4; }

/* A bullet chart: full range, middle half shaded, median tick, this organisation as a dot. */
function rangeBar(r) {
  var s = r.stats;
  if (!s || s.n < 2 || s.max === s.min) { return '<span class="mute">no spread</span>'; }
  var W = 320, pad = 8, x = function (v) { return pad + (W - 2 * pad) * (v - s.min) / (s.max - s.min); };
  var col = QCOL[r.quartile] || 'var(--accent)';
  var h = '<svg viewBox="0 0 ' + W + ' 46" class="rb" role="img" aria-label="' + esc(r.label) + ': position among ' + s.n + '">';
  h += '<rect x="' + pad + '" y="16" width="' + (W - 2 * pad) + '" height="8" rx="4" fill="var(--line)"/>';
  h += '<rect x="' + x(s.p25) + '" y="14" width="' + Math.max(3, x(s.p75) - x(s.p25)) + '" height="12" rx="3" fill="var(--band)"/>';
  h += '<line x1="' + x(s.median) + '" x2="' + x(s.median) + '" y1="11" y2="29" stroke="var(--mute)" stroke-width="2"/>';
  if (r.value != null) { h += '<circle cx="' + x(r.value) + '" cy="20" r="7" fill="' + col + '" stroke="var(--card)" stroke-width="2"/>'; }
  h += '<text x="' + pad + '" y="44" class="ax">' + esc(fmt(s.min, r.unit)) + '</text>';
  h += '<text x="' + (W - pad) + '" y="44" class="ax" text-anchor="end">' + esc(fmt(s.max, r.unit)) + '</text>';
  h += '<text x="' + x(s.median) + '" y="8" class="ax" text-anchor="middle">median ' + esc(fmt(s.median, r.unit)) + '</text>';
  return h + '</svg>';
}

/* ---------- trust dashboard ---------- */
function trustView(code) {
  if (!code) { return main('<div class="card">Pick a trust from the <a onclick="go(\'dashboard\')">dashboard</a>, or use the Explorer.</div>'); }
  state.current = code;
  Promise.all([api('/api/trusts/' + enc(code)), getCatalogue(), getTrusts()]).then(function (res) {
    var t = res[0], cat = res[1];
    if (!state.fields) {
      var saved = lsGet('fhi_fields');
      state.fields = (saved && saved.length) ? saved : coreCodes(cat);
    }
    if (state.scope == null) { state.scope = lsGet('fhi_scope') || 'subtype'; }
    var row = state.trusts.filter(function (x) { return x.ods_code === t.ods_code; })[0] || {};
    var h = '<div class="card"><div class="top"><div><h2 style="margin:0">' + esc(t.name || t.ods_code) + ' <span class="mute">' + esc(t.ods_code) + '</span></h2>' +
      '<p style="margin:6px 0 0">Strain ' + pill(t.strain.score) + ' ' + esc(t.strain.label) + ' &nbsp; CQC ' + cqcPill(row.cqc_overall) + ' &nbsp; <span id="grp" class="mute"></span></p></div>' +
      '<div class="ctl"><label class="mute">Switch trust <input list="tl" id="sw" placeholder="Name or code" onchange="switchTrust(this.value)"></label>' +
      '<datalist id="tl">' + state.trusts.map(function (x) { return '<option value="' + esc(x.ods_code) + '">' + esc(x.name) + '</option>'; }).join('') + '</datalist>' +
      '<label class="mute">Compare against <select id="scope" onchange="setScope(this.value)"><option value="subtype">Same subtype</option><option value="peers">Same trust type</option><option value="national">All organisations</option></select></label></div></div></div>';
    h += '<div class="card"><b>Fields</b> <span class="mute">core fields are shown by default; add or remove any measure</span>' +
      '<div id="chips" style="margin:8px 0"></div>' +
      '<input id="pq" placeholder="Search measures, e.g. waiting, backlog, CQC, workforce" oninput="drawPicker()" style="width:100%;max-width:520px"> ' +
      '<button class="act" onclick="resetFields()">Reset to core</button> <button class="act" style="background:none;color:var(--accent)" onclick="clearFields()">Clear</button>' +
      '<div id="picker" class="picker"></div></div>';
    h += '<div id="merged"></div><div id="bench"></div>';
    if (t.systems.length) {
      h += '<div class="card"><b>Installed systems (FHI)</b><table>' + t.systems.map(function (s) {
        return '<tr><td>' + esc(s.category) + '</td><td>' + esc(s.supplier) + '</td><td>' + esc(s.product) + '</td><td>' + esc(s.contract_end) + '</td></tr>';
      }).join('') + '</table></div>';
    }
    h += '<details class="card"><summary><b>All loaded values for this trust</b> <span class="mute">' + t.metrics.length + ' metrics, latest and previous</span></summary>' + fullTable(t) + '</details>';
    main(h);
    document.getElementById('scope').value = state.scope;
    drawChips(); drawPicker(); refreshBench();
  }).catch(fail);
}
function fullTable(t) {
  var by = {}, h = '';
  t.metrics.forEach(function (m) { (by[m.source] = by[m.source] || []).push(m); });
  Object.keys(by).forEach(function (src) {
    h += '<p><b>' + esc(src.toUpperCase()) + '</b> <span class="mute">' + by[src].length + ' metrics</span></p><div class="wrap"><table><tr><th>Metric</th><th>Period</th><th class="n">Value</th><th class="n">Previous</th></tr>';
    by[src].slice(0, 300).forEach(function (m) {
      h += '<tr><td>' + esc(m.label || m.metric_code) + '</td><td>' + esc(m.period) + '</td><td class="n">' + (m.unit === 'rating' ? (CQC[m.value] || m.value) : num(m.value, 2)) + '</td><td class="n">' +
        (m.previous_value == null ? '–' : (m.unit === 'rating' ? (CQC[m.previous_value] || m.previous_value) : num(m.previous_value, 2)) + ' <span class="mute">(' + esc(m.previous_period) + ')</span>') + '</td></tr>';
    });
    h += '</table></div>';
  });
  return h;
}
function switchTrust(v) {
  v = (v || '').trim().toLowerCase();
  var hit = state.trusts.filter(function (x) { return x.ods_code.toLowerCase() === v || (x.name || '').toLowerCase() === v; })[0];
  if (hit) { go('trust', hit.ods_code); }
}
function setScope(v) { state.scope = v; lsSet('fhi_scope', v); refreshBench(); }
function setFields(list) { state.fields = list; lsSet('fhi_fields', list); drawChips(); drawPicker(); refreshBench(); }
function resetFields() { setFields(state.coreCodes(cat)); }
function clearFields() { setFields([]); }
function toggleField(code, on) {
  var f = state.fields.filter(function (c) { return c !== code; });
  if (on) { f.push(code); }
  setFields(f.slice(0, 60));
}
function drawChips() {
  var by = {};
  state.cat.forEach(function (c) { by[c.metric_code] = c; });
  document.getElementById('chips').innerHTML = state.fields.map(function (c) {
    var m = by[c];
    return '<span class="chip">' + esc(m ? shortLabel(m.label) : c) + ' <a title="Remove" onclick="toggleField(\'' + esc(c) + '\',false)">×</a></span>';
  }).join('') || '<span class="mute">No fields selected.</span>';
}
function shortLabel(l) { l = String(l || ''); return l.length > 60 ? l.slice(0, 58) + '…' : l; }
function drawPicker() {
  var q = (document.getElementById('pq').value || '').toLowerCase().trim();
  var chosen = {};
  state.fields.forEach(function (c) { chosen[c] = 1; });
  var hits = state.cat.filter(function (c) {
    return !q ? c.core : (c.label.toLowerCase().indexOf(q) >= 0 || c.metric_code.toLowerCase().indexOf(q) >= 0 || c.source_label.toLowerCase().indexOf(q) >= 0);
  });
  var h = '<p class="mute" style="margin:8px 0 4px">' + (q ? hits.length + ' matching measures' + (hits.length > 60 ? ' (first 60 shown)' : '') : 'Core fields. Search to find any of the ' + state.cat.length + ' comparable measures.') + '</p>';
  var last = '';
  hits.slice(0, 60).forEach(function (c) {
    if (c.source_label !== last) { h += '<div class="gh">' + esc(c.source_label) + '</div>'; last = c.source_label; }
    h += '<label class="pk"><input type="checkbox" ' + (chosen[c.metric_code] ? 'checked' : '') + ' onchange="toggleField(\'' + esc(c.metric_code) + '\',this.checked)"> ' +
      esc(shortLabel(c.label)) + ' <span class="mute">· ' + c.orgs + ' orgs' + (c.polarity ? '' : ' · no direction') + '</span></label>';
  });
  document.getElementById('picker').innerHTML = h;
}
function refreshBench() {
  var box = document.getElementById('bench');
  if (!state.fields.length) { box.innerHTML = '<div class="card mute">Choose at least one field above.</div>'; return; }
  box.innerHTML = '<div class="card mute">Loading…</div>';
  var asked = state.current;
  api('/api/benchmark/trust/' + enc(asked) + '?scope=' + state.scope + '&codes=' + enc(state.fields.join(','))).then(function (b) {
    if (asked !== state.current) { return; }
    var mb = document.getElementById('merged');

function trendChart(t) {

  [0, 0.5, 1].forEach(function (f) {
    var v = lo + (hi - lo) * f;

  if (up.length > 1) { h += '<polygon points="' + up.concat(dn).join(' ') + '" fill="var(--band)" opacity=".7"/>'; }
  var med = '', line = '';

  var started = false;

  h += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="3"/>';
  pts.forEach(function (p, i) {
    if (p.value == null) { return; }
    h += '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="4" fill="' + (QCOL[p.quartile] || 'var(--accent)') + '" stroke="var(--card)" stroke-width="2"><title>' +
      esc(p.period + ': ' + fmt(p.value, t.unit) + (p.rank ? ' · rank ' + p.rank + ' of ' + p.n : '') + (p.median != null ? ' · group median ' + fmt(p.median, t.unit) : '')) + '</title></circle>';

  [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i) {
    h += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="ax" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + esc(pts[i].period) + '</text>';
  });
  h += '</svg>';

      (first.rank && last.rank ? ' · rank ' + first.rank + ' of ' + first.n + ' to ' + last.rank + ' of ' + last.n : '');
  }
  return '<div class="mute" style="font-size:12px;margin-bottom:2px">Solid line: this trust. Dashed line and band: median and middle half of ' + esc(t.peer_label) + '. ' + sum + (t.method_break ? ' <span style="color:var(--s4)">' + esc(t.method_break.note) + '</span>' : '') + '</div>' + h;
}

  var med = '';
  P.forEach(function (p, i) { if (p.median != null) { med += (med ? 'L' : 'M') + x(i) + ',' + y(p.median); } });
  h += '<path d="' + med + '" fill="none" stroke="var(--mute)" stroke-width="2.5" stroke-dasharray="6 4"/>';
  if (mine) {
    var d2 = '', on2 = false;
    mine.values.forEach(function (v, i) { if (v == null) { on2 = false; return; } d2 += (on2 ? 'L' : 'M') + x(i) + ',' + y(v); on2 = true; });
    h += '<path d="' + d2 + '" fill="none" stroke="var(--accent)" stroke-width="3.5"/>';
    mine.values.forEach(function (v, i) {
      if (v != null) { h += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"><title>' + esc(P[i].period + ': ' + fmt(v, t.unit) + (P[i].median != null ? ' · group median ' + fmt(P[i].median, t.unit) : '')) + '</title></circle>'; }
    });
  }
  h += '</g>';
  var lastI = n - 1;
  if (P[lastI].median != null) { h += '<text x="' + (W - R + 8) + '" y="' + (y(P[lastI].median) + 4) + '" class="ax">median ' + esc(fmt(P[lastI].median, t.unit)) + '</text>'; }
  if (mine) {
    var lv = null; mine.values.forEach(function (v) { if (v != null) { lv = v; } });
    if (lv != null) { h += '<text x="' + (W - R + 8) + '" y="' + (y(lv) - 6) + '" class="lbl">' + esc((mine.name || mine.ods_code).slice(0, 24)) + '</text><text x="' + (W - R + 8) + '" y="' + (y(lv) + 9) + '" class="lbl">' + esc(fmt(lv, t.unit)) + '</text>'; }
  }
  [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i) {
    h += '<text x="' + x(i) + '" y="' + (H - 10) + '" class="ax" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + esc(P[i].period) + '</text>';
  });
  return h + '</svg><p class="mute" style="margin:4px 0 0;font-size:12px">Dashed line: group median. Dark band: middle half; light band: 10th to 90th percentile.' +
    (showLines ? ' Faint lines: each organisation (click one to highlight it); lines beyond the plotted range are clipped.' : ' Individual lines are hidden above 250 organisations: pick a type or subtype to see them.') +
    (mine ? '' : ' Highlight a trust to draw its line.') + (t.method_break ? ' <span style="color:var(--s4)">' + esc(t.method_break.note) + '</span>' : '') + '</p>';
}
/* Largest movers between each organisation's first and last value in the window. */
function movers(t) {
  var rows = [];
  t.series.forEach(function (s) {
    var f = null, l = null;
    s.values.forEach(function (v) { if (v != null) { if (f == null) { f = v; } l = v; } });
    if (f != null && l != null && s.values.filter(function (v) { return v != null; }).length >= 3) { rows.push({s: s, f: f, l: l, d: l - f}); }
  });
  if (rows.length < 4) { return ''; }
  var good = function (r) { return t.polarity === 'lower' ? -r.d : r.d; };
  rows.sort(function (a, b) { return good(b) - good(a); });
  var cols = function (list, title) {
    return '<div><b>' + title + '</b><table>' + list.map(function (r) {
      return '<tr><td><a data-pick="' + esc(r.s.ods_code) + '">' + esc(r.s.name || r.s.ods_code) + '</a></td><td class="n">' + esc(fmt(r.f, t.unit)) + ' → ' + esc(fmt(r.l, t.unit)) + '</td><td class="n"><b>' + (r.d > 0 ? '+' : '') + num(r.d, Math.abs(r.d) >= 100 ? 0 : 2) + '</b></td></tr>';
    }).join('') + '</table></div>';
  };
  var pol = !!t.polarity;
  return '<div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">' +
    cols(rows.slice(0, 8), pol ? 'Biggest improvers' : 'Largest rises') +
    cols(rows.slice(-8).reverse(), pol ? (good(rows[rows.length - 1]) < 0 ? 'Biggest decliners' : 'Smallest improvements') : 'Largest falls') +
    '</div><p class="mute" style="margin:8px 0 0;font-size:12px">Change between each organisation\'s first and last value in the window (organisations with at least three values).</p></div>';
}
/* Continuous measures: one dot per organisation, stacked so none overlap; the chosen trust is the large dot. */
function swarm(v, mine) {
  var s = v.stats, W = 1000, H = 240, pad = 24, cy = 108, r = 4.5, step = 2 * r + 0.5;
  var x = function (val) { return pad + (W - 2 * pad) * (val - s.min) / ((s.max - s.min) || 1); };
  var order = v.points.slice().sort(function (a, b) { return a.value - b.value; });
  var slots = [0], last = {}, i;
  for (i = 1; i <= 11; i++) { slots.push(i, -i); }
  var dots = '';
  order.forEach(function (p) {
    var px = x(p.value), k = null, j;
    for (j = 0; j < slots.length; j++) { if (last[slots[j]] === undefined || px - last[slots[j]] >= step) { k = slots[j]; break; } }
    if (k === null) { k = slots[0]; slots.forEach(function (sl) { if ((last[sl] || -1e9) < (last[k] || -1e9)) { k = sl; } }); }
    last[k] = px;
    var isMine = p.ods_code === state.hl;
    if (!isMine) { dots += '<circle data-ods="' + esc(p.ods_code) + '" cx="' + px.toFixed(1) + '" cy="' + (cy + k * step).toFixed(1) + '" r="' + r + '" fill="var(--dot)" fill-opacity=".75"><title>' + esc((p.name || p.ods_code) + ': ' + fmt(p.value, v.unit)) + '</title></circle>'; }
    else { p._cy = cy + k * step; }
  });
  var h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Distribution of ' + esc(v.label) + ' across organisations">';
  h += '<rect x="' + x(s.p25) + '" y="6" width="' + Math.max(3, x(s.p75) - x(s.p25)) + '" height="' + (H - 40) + '" fill="var(--band)" opacity=".55"/>';
  h += '<line x1="' + x(s.median) + '" x2="' + x(s.median) + '" y1="6" y2="' + (H - 34) + '" stroke="var(--mute)" stroke-dasharray="4 3"/>';
  h += dots;
  if (mine) {
    var mx = x(mine.value), my = mine._cy === undefined ? cy : mine._cy, anchor = mx > W * 0.7 ? 'end' : mx < W * 0.3 ? 'start' : 'middle';
    h += '<circle cx="' + mx + '" cy="' + my + '" r="9" fill="var(--accent)" stroke="var(--card)" stroke-width="3"><title>' + esc((mine.name || mine.ods_code) + ': ' + fmt(mine.value, v.unit)) + '</title></circle>';
    h += '<text x="' + mx + '" y="' + Math.max(16, my - 16) + '" text-anchor="' + anchor + '" class="lbl">' + esc(mine.name || mine.ods_code) + '</text>';
  }
  h += '<text x="' + pad + '" y="' + (H - 12) + '" class="ax">' + esc(fmt(s.min, v.unit)) + '</text>';
  h += '<text x="' + (W - pad) + '" y="' + (H - 12) + '" class="ax" text-anchor="end">' + esc(fmt(s.max, v.unit)) + '</text>';
  h += '<text x="' + x(s.median) + '" y="' + (H - 12) + '" class="ax" text-anchor="middle">median ' + esc(fmt(s.median, v.unit)) + '</text>';
  if (v.polarity) { h += '<text x="' + (v.polarity === 'higher' ? W - pad : pad) + '" y="' + (H - 28) + '" class="ax" text-anchor="' + (v.polarity === 'higher' ? 'end' : 'start') + '">' + (v.polarity === 'higher' ? 'better →' : '← better') + '</text>'; }
  return h + '</svg><p class="mute" style="margin:4px 0 0;font-size:12px">Each dot is one organisation; shaded band is the middle half; click a dot to highlight it.</p>';
}
/* Few distinct values (segments, ratings, flags): count bars, the chosen trust's bar in the accent colour. */
function histogram(v, mine) {
  var counts = {}, keys = [];
  v.points.forEach(function (p) { if (counts[p.value] === undefined) { counts[p.value] = 0; keys.push(p.value); } counts[p.value]++; });
  keys.sort(function (a, b) { return a - b; });
  var W = 1000, H = 240, pad = 30, bw = Math.min(140, (W - 2 * pad) / keys.length - 12), max = Math.max.apply(null, keys.map(function (k) { return counts[k]; }));
  var h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Count of organisations at each value of ' + esc(v.label) + '">';
  keys.forEach(function (k, i) {
    var bh = (H - 70) * counts[k] / max, bx = pad + i * ((W - 2 * pad) / keys.length) + ((W - 2 * pad) / keys.length - bw) / 2, isMine = mine && mine.value === k;
    h += '<rect x="' + bx + '" y="' + (H - 40 - bh) + '" width="' + bw + '" height="' + bh + '" rx="4" fill="' + (isMine ? 'var(--accent)' : 'var(--dot)') + '"/>';
    h += '<text x="' + (bx + bw / 2) + '" y="' + (H - 44 - bh) + '" text-anchor="middle" class="lbl">' + counts[k] + '</text>';
    h += '<text x="' + (bx + bw / 2) + '" y="' + (H - 22) + '" text-anchor="middle" class="ax">' + esc(fmt(k, v.unit)) + '</text>' +
      (isMine ? '<text x="' + (bx + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" class="lbl">▲ ' + esc((mine.name || mine.ods_code).slice(0, 34)) + '</text>' : '');
  });
  return h + '</svg>';
}
function drawRanking() {
  var v = state.view, q = (document.getElementById('rq').value || '').toLowerCase();
  var rows = '', shown = 0, topv = Math.max.apply(null, v.points.map(function (p) { return Math.abs(p.value); })) || 1;
  var rank = 0, prev = null, seen = 0;
  v.points.forEach(function (p) {
    seen++;
    if (prev === null || p.value !== prev) { rank = seen; prev = p.value; }
    if (q && (p.name || '').toLowerCase().indexOf(q) < 0 && p.ods_code.toLowerCase().indexOf(q) < 0) { return; }
    if (shown++ >= 600) { return; }
    var mineRow = p.ods_code === state.hl;
    rows += '<tr' + (mineRow ? ' class="me" id="merow"' : '') + '><td class="n">' + rank + '</td><td><a onclick="go(\'trust\',\'' + esc(p.ods_code) + '\')">' + esc(p.name || p.ods_code) + '</a> <span class="mute">' + esc(p.ods_code) + '</span></td>' +
      '<td><span class="tag">' + esc(p.subtype_label || v.groups[p.group]) + '</span></td><td class="n">' + esc(fmt(p.value, v.unit)) + '</td>' +
      '<td style="width:26%"><div class="bar" style="width:' + Math.max(1, Math.round(100 * Math.abs(p.value) / topv)) + '%;background:' + (mineRow ? 'var(--accent)' : 'var(--dot)') + '"></div></td></tr>';
  });
  var box = document.getElementById('rank');
  box.innerHTML = '<table><tr><th class="n">Rank</th><th>Organisation</th><th>Type</th><th class="n">Value</th><th></th></tr>' + rows + '</table>';
  var me = document.getElementById('merow');
  if (me && !q) { box.scrollTop = Math.max(0, me.offsetTop - 120); }
}

function compareView() {
  var codes = state.cmp.join(',');
  var h = '<div class="card">Tick up to five trusts on the dashboard, then return here. Selected: <b>' + esc(codes || 'none') + '</b></div>';
  if (!codes) { return main(h); }
  api('/api/compare?codes=' + encodeURIComponent(codes)).then(function (c) {
    h += '<div class="card wrap"><table><tr><th>Metric</th>' + c.trusts.map(function (t) { return '<th class="n">' + esc(t.name || t.ods_code) + '<br>' + pill(t.strain) + '</th>'; }).join('') + '</tr>';
    c.rows.slice(0, 400).forEach(function (r) {
      h += '<tr><td>' + esc(r.label || r.metric_code) + ' <span class="tag">' + esc(r.source) + '</span></td>' +
        c.trusts.map(function (t) { var v = r.values[t.ods_code]; return '<td class="n">' + (v ? num(v.value, 2) : '–') + '</td>'; }).join('') + '</tr>';
    });
    main(h + '</table></div>');
  }).catch(fail);
}

function sourcesView() {
  Promise.all([api('/api/sources'), api('/api/runs')]).then(function (res) {
    var s = res[0], runs = res[1];
    var h = '<div class="card"><button class="act" onclick="runRefresh()">Refresh all sources</button> <span id="rmsg" class="mute"></span>' +
      '<p class="mute">Each refresh discovers the latest files from NHS England and NHS Digital, downloads them and loads them. First runs are slow. Reload this tab to see progress.</p></div>';
    h += '<div class="card"><b>Coverage</b><table><tr><th>Source</th><th class="n">Metric rows</th><th class="n">Organisations</th><th class="n">Latest period key</th></tr>' +
      s.coverage.map(function (c) { return '<tr><td>' + esc(c.source) + '</td><td class="n">' + num(c.metrics, 0) + '</td><td class="n">' + c.orgs + '</td><td class="n">' + c.latest_period_sort + '</td></tr>'; }).join('') + '</table></div>';
    h += '<div class="card"><b>Files and field inventory</b><div class="wrap"><table><tr><th>Source</th><th>File</th><th>Status</th><th>Mapper</th><th class="n">Rows</th><th class="n">Metrics</th><th>Retrieved</th></tr>';
    s.files.forEach(function (f) {
      h += '<tr><td>' + esc(f.source) + '</td><td><a onclick="toggle(' + f.id + ')">' + esc(f.file_name || f.file_url || '(none)') + '</a>' + (f.error ? '<br><span class="dn">' + esc(f.error.slice(0, 200)) + '</span>' : '') +
        '<pre id="p' + f.id + '" style="display:none">' + esc(JSON.stringify(f.profile, null, 1)) + '</pre></td><td>' + esc(f.status) + '</td><td>' + esc(f.mapper_status) + '</td><td class="n">' + num(f.rows, 0) + '</td><td class="n">' + num(f.metric_rows, 0) + '</td><td>' + esc((f.retrieved_at || '').slice(0, 16)) + '</td></tr>';
    });
    h += '</table></div></div><div class="card"><b>Refresh runs</b>' + runs.map(function (r) {
      return '<p><span class="tag">' + esc(r.status) + '</span> ' + esc(r.started_at.slice(0, 16)) + ' (' + esc(r.trigger) + ')<pre>' + esc(r.log) + '</pre></p>';
    }).join('') + '</div>';
    h += '<div class="card"><b>Installed-systems overlay</b><p class="mute">CSV with columns ods_code, category, supplier, product, contract_end, note.</p>' +
      '<input type="file" id="sysfile" accept=".csv"> <button class="act" onclick="uploadSystems()">Import</button> <span id="smsg" class="mute"></span></div>';
    main(h);
  }).catch(fail);
}
function toggle(id) { var e = document.getElementById('p' + id); e.style.display = e.style.display === 'none' ? 'block' : 'none'; }
function runRefresh() {
  api('/api/refresh', {method: 'POST'}).then(function () { document.getElementById('rmsg').textContent = 'Started. Reload this tab in a minute.'; }).catch(fail);
}
function uploadSystems() {
  var f = document.getElementById('sysfile').files[0];
  if (!f) { return; }
  var fd = new FormData(); fd.append('file', f);
  api('/api/systems/import', {method: 'POST', body: fd}).then(function (r) {
    document.getElementById('smsg').textContent = 'Imported ' + r.imported + ' rows. Join rate to public data: ' + Math.round(r.join_rate * 100) + '%. Unmatched: ' + r.codes_not_in_public_data.join(', ');
  }).catch(fail);
}
function fail(e) { main('<div class="card dn">' + esc(e.message) + '</div>'); }
nav(); go('dashboard');
</script>
</body>
